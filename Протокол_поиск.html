.cnt{color:var(--mute);font-size:13px;margin-top:8px}
main{padding:12px 16px 40px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.nm{font-weight:600;font-size:16px}.meta{color:var(--mute);font-size:13px;margin-top:3px}
.cl{margin:8px 0 0;padding:0;list-style:none}.cl li{font-size:13.5px;padding:5px 8px;background:var(--accbg);border-radius:6px;margin-top:4px}
mark{background:var(--mark);color:inherit;border-radius:2px}
details.card{padding:0}details summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:14.5px;list-style:none}
details summary::-webkit-details-marker{display:none}details summary .n{color:var(--mute);font-weight:400}
details[open] summary{border-bottom:1px solid var(--line)}
.ath{padding:8px 14px;border-bottom:1px solid var(--line);font-size:14px}.ath:last-child{border-bottom:0}
.ath b{font-weight:600}.empty{text-align:center;color:var(--mute);padding:40px 0}
